version: 2

models:
  - name: stg_users
    description: "Users cleaned (silver)"
    columns:
      - name: user_id
        description: "Primary key (uuid)"
        data_tests: [unique, not_null]
      - name: username
        description: "Username as in bronze (trimmed)"
      - name: username_normalized
        description: "Username trimmed and lowercased"
        data_tests: [not_null]
      - name: email
        data_tests: [not_null]
      - name: sex
        data_tests:
          - accepted_values:
              arguments:
                values: ['F', 'M']
      - name: birthdate
        description: "Birthdate, NULL when later than the user's first order"
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: birthdate_is_valid
        description: "False when birthdate is missing or later than the first order"
        data_tests: [not_null]

  - name: stg_orders
    description: "Orders cleaned and deduplicated (silver)"
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: user_id
      - name: quantity
        data_tests: [not_null, positive_value]
      - name: product
        data_tests:
          - accepted_values:
              arguments:
                values: ['bread', 'brioche', 'cookie', 'croissant', 'donut', 'drink']
